spring:
  application:
    name: astr-ai-code-mother-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/astr-ai-code
    username: root
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi项目配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.astr.astraicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# 默认 ChatModel 只服务工作流节点，失败由节点重试钩子统一重试（NodeRetryHook），模型层不再重试
langchain4j:
  open-ai:
    chat-model:
      max-retries: 0
  # Redis starter 默认会自动装配 RedisEmbeddingStore（需要 Redis Stack），知识库用的是内存存储，关掉避免误触发
  community:
    redis:
      enabled: false
# 文生图配置（provider 可选：dashscope）
image-generation:
  provider: dashscope
# 阿里云 DashScope 配置（api-key 写在 application-{profile}.yml）
dashscope:
  image-model: wan2.2-t2i-flash
  embedding-model: text-embedding-v4
  compatible-base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
# 代码知识库（RAG）
code-knowledge:
  location: classpath*:code-knowledge/**/*.md
  # 低于该相似度视为未命中，不注入提示词
  min-score: 0.68
